<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callback: a job-hunt game</title>
<style>
:root{--desk:#1e3a4c;--paper:#fdfdfb;--ink:#1c2730;--muted:#5b6a74;--hl:#ffd84a;--red:#c4402f;--green:#2b7a57;--line:#d8dcde}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:0 auto;padding:14px 20px;color:#e8f0f3}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:22px}
.qbtn{font:inherit;font-size:14px;color:#e8f0f3;background:transparent;border:1.5px solid #8fa5b3;border-radius:4px;padding:5px 14px;cursor:pointer}
.qbtn:hover{border-color:#fff}
main{max-width:1040px;margin:0 auto;padding:0 20px 56px}
.paper{background:var(--paper);padding:28px 30px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.paper+.paper{margin-top:18px}
.narrow{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:44px}h2{font-size:28px}h3{font-size:18px;margin-top:1.1em}
p{margin:0 0 .9em}
.muted{color:var(--muted)}.sub{color:var(--muted);margin-bottom:1em}
.center{text-align:center}
.note{background:#f3f5f6;border-left:4px solid var(--hl);padding:10px 14px;font-size:15px;text-align:left}
.doc{font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.doc ul{padding-left:20px;margin:0 0 .6em}.doc li{margin-bottom:.3em}
.btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:2px solid var(--ink);padding:10px 22px;border-radius:4px;cursor:pointer}
.btn:hover:not(:disabled){background:#2e4352}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:#eef1f2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.center .btns{justify-content:center}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible,label.field:focus-within{outline:3px solid #1b6fd1;outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;font-size:15px;text-align:left}
.check input{margin-top:5px}
form.setup{text-align:left;margin-top:18px}
.setup label.t{display:block;font-weight:600;font-size:15px;margin:14px 0 4px}
.setup input[type=text]{width:100%;font:inherit;padding:9px 12px;border:1.5px solid #b9c1c6;border-radius:4px}
.setup .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.err{color:var(--red);font-size:14px;margin:4px 0 0}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:8px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.field{display:flex;flex-direction:column;gap:2px;border:1.5px solid #b9c1c6;border-radius:4px;padding:12px;cursor:pointer;background:#fff}
label.field input{position:absolute;opacity:0;pointer-events:none}
label.field:has(input:checked){background:var(--hl);border-color:var(--ink)}
label.field b{font-family:Georgia,serif;font-size:18px}
label.field span{font-size:13px}
.build{display:grid;grid-template-columns:4fr 8fr;gap:20px;align-items:start}
.build .paper+.paper{margin-top:0}
.jd-sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.count{font-family:system-ui,sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
.opts-label{font-size:13px;color:var(--muted);margin:14px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.chip{font:inherit;font-size:14px;text-align:left;background:#fff;border:1.5px solid #b9c1c6;border-radius:3px;padding:6px 10px;margin:0 6px 6px 0;cursor:pointer;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip.on{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);border-color:transparent;font-weight:600;display:block;width:100%;margin:0 0 6px}
.slot{border:1.5px dashed #b9c1c6;border-radius:3px;padding:6px 10px;margin:0 0 6px;color:var(--muted);font-size:14px}
.resume h2{margin-bottom:.1em}
.resume .contact{margin-bottom:.2em}
.resume ul{margin:0;padding-left:18px}
.resume li{margin-bottom:.35em}
.stamp{display:inline-block;border:4px solid currentColor;padding:6px 18px;font:800 28px/1.1 Georgia,serif;text-transform:uppercase;transform:rotate(-5deg);animation:slam .35s ease-out both;border-radius:6px;margin:6px 0 18px}
.stamp.red{color:var(--red)}.stamp.green{color:var(--green)}.stamp.grey{color:#6b7780}
@keyframes slam{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.mail{border-left:4px solid var(--ink);padding:10px 16px;background:#f3f5f6;font-family:Georgia,serif;text-align:left;margin:0 0 1em}
.wait .day{font:700 40px/1 Georgia,serif;margin:8px 0 12px}
.bar{height:8px;background:#e3e7e9;border-radius:4px;overflow:hidden;max-width:420px;margin:0 auto 18px}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s linear}
.who{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.who h2{font-size:22px;margin:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px 2px 10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg p{margin:0;padding:10px 14px;border-radius:12px;max-width:82%;white-space:pre-wrap}
.msg.them p{background:#eef2f3}
.msg.me{justify-content:flex-end}.msg.me p{background:var(--hl)}
textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #b9c1c6;border-radius:4px;resize:vertical;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:12px}
.stats{display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:18px}
.center .stats{justify-content:center}
.stats b{display:block;font-size:22px;color:var(--ink);font-family:Georgia,serif}
.debrief{text-align:left;margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
.debrief ul{padding-left:20px;margin:0 0 .8em}
.good::marker{color:var(--green)}.bad::marker{color:var(--red)}
.tag-good{color:var(--green)}.tag-bad{color:var(--red)}

.scene{width:100%;max-width:560px;height:auto;display:block;margin:10px auto 14px;border-radius:4px}
.cap{min-height:1.6em;font-weight:600}
.sky{fill:#a9d8f2;transition:fill .8s}.night .sky{fill:#1c2a45}
.sun,.moon,.star{transition:opacity .8s}.moon,.star{opacity:0}.night .moon,.night .star{opacity:1}.night .sun{opacity:0}
.dim{opacity:0;transition:opacity .8s}.night .dim{opacity:.32}
.cell{fill:#e3e7e9;transition:fill .3s}.cell.x{fill:#c4402f}
.hand-m{transform-origin:128px 48px;animation:spin 3s linear infinite}
.hand-h{transform-origin:128px 48px;animation:spin 36s linear infinite}
.refresh{transform-origin:178px 108px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scr-search,.scr-inbox,.scr-saver,.fig-type,.fig-sad,.fig-sleep{display:none}
.m-search .scr-search,.m-search .fig-type,.m-check .scr-inbox,.m-check .fig-type,.m-sad .scr-inbox,.m-sad .fig-sad,.m-sleep .scr-saver,.m-sleep .fig-sleep{display:inline}
.tap{animation:tap .45s ease-in-out infinite alternate}
.m-search .tap{animation-duration:1.1s}
@keyframes tap{to{transform:translateY(-3px)}}
.nod{transform-origin:266px 152px;animation:nod 2.2s ease-in-out infinite alternate}
@keyframes nod{to{transform:rotate(3deg)}}
.hl{animation:hl 3.4s step-end forwards}
.found .hl{stroke:#2b7a57}
@keyframes hl{0%{transform:translateY(0)}20%{transform:translateY(11px)}40%{transform:translateY(22px)}55%{transform:translateY(33px)}75%{transform:translateY(11px)}100%{transform:translateY(22px)}}
.sigh{animation:sigh 2.4s ease-in-out infinite}
@keyframes sigh{0%,100%{opacity:.25}50%{opacity:1}}
.z{font:700 15px system-ui,sans-serif;fill:#5b6a74;opacity:0;animation:zfloat 2.4s ease-out infinite}
.z2{animation-delay:.8s}.z3{animation-delay:1.6s}
@keyframes zfloat{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.bounce{animation:bounce 3s linear infinite alternate}
@keyframes bounce{to{transform:translateX(94px)}}
@media(max-width:900px){.build{grid-template-columns:1fr}.jd-sticky{position:static;max-height:none}}
@media(max-width:620px){.cols,.fields{grid-template-columns:1fr}.paper{padding:22px 18px}h1{font-size:36px}}
@media(prefers-reduced-motion:reduce){.stamp{animation:none}.bar i{transition:none}.scene *{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wc = t => t.trim().split(/\s+/).filter(Boolean).length;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
let CHIPS = null;
const chipById = id => { for (const k in CHIPS) for (const c of CHIPS[k].items) if (c.id === id) return c; };

function lev(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({length: m + 1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
const norm = t => t.toLowerCase().replace(/[^a-z0-9'\-\/ ]+/g, ' ').replace(/\s+/g, ' ').trim();
// Matches word stems ("managing" ~ "manag"), phrases, and one-letter typos in longer words.
function matches(text, variants) {
  const t = norm(text), toks = t.split(' ');
  for (const v of variants) {
    if (v.includes(' ') || v.includes('-') || v.includes('/')) { if (t.includes(v)) return true; continue; }
    for (const tok of toks) {
      if (tok.startsWith(v)) return true;
      if (v.length >= 6 && tok.length >= v.length - 1 && lev(tok.slice(0, v.length), v) <= 1) return true;
    }
  }
  return false;
}

/* ---------- Building a run (the posting drives the options and the questions) ---------- */
const pickN = (a, n) => shuffle(a).slice(0, n);
const toTarget = x => ({id:x.id, name:x.t, v:x.v});

function buildChips(f, fs, fv, fi) {
  let n = 0;
  const mk = (items, ok, kind) => items.map(x => ({id:'c' + (n++), t:x.t || x, ok, kind}));
  const notIn = (pool, feat) => pool.filter(x => !feat.includes(x));
  return {
    skills:{title:'Key skills', slots:SLOTS.skills, items:[...mk(fs, 1, 'ok'), ...mk(pickN(notIn(f.skills, fs), 3), 0, 'off'), ...mk(pickN(f.skillFluff, 2), 0, 'fluff')]},
    values:{title:'Core values', slots:SLOTS.values, items:[...mk(fv, 1, 'ok'), ...mk(pickN(notIn(VALUES_POOL, fv), 2), 0, 'off'), ...mk(pickN(VALUE_FLUFF, 2), 0, 'fluff')]},
    ideas:{title:'Key ideas', slots:SLOTS.ideas, items:[...mk(fi, 1, 'ok'), ...mk(pickN(notIn(f.ideas, fi), 2), 0, 'off'), ...mk(pickN([...IDEA_FLUFF, ...f.ideaFluff], 2), 0, 'fluff')]}
  };
}

function buildJD(f, company, fs, fv, fi) {
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join('');
  const fluff = shuffle(FLUFF).slice(0, 2).join(' ');
  const perks = shuffle(PERKS).slice(0, 3);
  const perkText = perks.slice(0, 2).join(', ') + ' and ' + perks[2];
  const duties = shuffle([...fs.map(x => x.duty), pick(GEN_DUTY)]);
  const bring = [`${pick(f.years)} years in a similar role.`, ...shuffle([...fi.map(x => x.req), pick(GEN_REQ)])];
  return `<article class="doc jd">
<h2>${esc(f.title)}</h2>
<p class="sub">${esc(company)}, ${esc(pick(LOCATIONS))}</p>
<h3>About us</h3>
<p>${esc(company)} ${esc(f.about)} ${esc(fluff)}</p>
<h3>What you will do</h3>
<ul>${li(duties)}</ul>
<h3>What you bring</h3>
<ul>${li(bring)}</ul>
<h3>What we value</h3>
<ul>${li(shuffle(fv.map(x => x.line)))}</ul>
<h3>Pay and perks</h3>
<p>${esc(pick(f.salaries))} a year, plus ${esc(perkText)}.</p>
</article>`;
}

// Picks n questions that together cover as many of the posting's featured items as possible.
function pickQs(pool, featuredIds, n) {
  const left = shuffle(pool.filter(q => q.tags.some(t => featuredIds.includes(t))));
  const covered = new Set(), out = [];
  while (out.length < n && left.length) {
    let best = -1, bi = 0;
    left.forEach((q, i) => {
      const sc = q.tags.filter(t => featuredIds.includes(t) && !covered.has(t)).length + Math.random() * 0.5;
      if (sc > best) { best = sc; bi = i; }
    });
    const q = left.splice(bi, 1)[0];
    q.tags.forEach(t => covered.add(t)); out.push(q.q);
  }
  return out;
}

function buildRounds(f, company, first, fs, fv, fi) {
  const lc = company.toLowerCase();
  const coWords = [lc, lc.split(' ')[0], ...f.coWords];
  const ids = a => a.map(x => x.id);
  const r1 = {
    name:'Morgan Kingsley', role:'Talent partner', initials:'PN', color:'#2f7f86',
    blurb:'Friendly and quick. She is working through a screening checklist.',
    intro:`Hi ${first}, I'm Morgan from the talent team at ${company}. Thanks for making time. I have three questions for you.`,
    qs:[`Tell me a bit about yourself and why you want to work at ${company}.`, ...pickQs(fv.map(v => ({q:v.q, tags:[v.id]})), ids(fv), 2)],
    close:"That's everything I needed. Thanks for your time. We'll be in touch.",
    react:{low:'(glances at the clock) Mm-hm. Thanks.', mid:'(ticks a box) Okay, good.', high:"(smiles and writes quickly) Great, that's helpful."},
    passNote:`Hi ${first}! Thanks for chatting with me. I'd like to move you on to the next round with Marcus Webb, our ${f.r2role.toLowerCase()}.`,
    targets:[...fv.map(toTarget),
      {id:'comm', name:'Communication', v:['communicat','keep informed','keeping informed','updates','listen','transparen','check-in']},
      {id:'co', name:'Knowing the company', v:coWords}]
  };
  const r2 = {
    name:'Ashford Croft', role:f.r2role, initials:'MW', color:'#b7791f',
    blurb:'Direct, asks follow-ups, and has watched many projects fail.',
    intro:"Ashford Croft. I lead the team you would join. Let's get into how you actually work.",
    qs:pickQs([...f.skills.map(s => ({q:s.q, tags:[s.id]})), ...f.combos], ids(fs), 3),
    close:"That's all from me. Thanks for coming in. We'll be in touch.",
    react:{low:'(frowns at his notes) Right.', mid:'(nods slowly) Okay.', high:'(leans back, then forward) Good. Keep going.'},
    passNote:`Hi ${first}, Croft here. Daniella Hathaway, our ${f.r3role}, would like to meet you for a final conversation.`,
    targets:fs.map(toTarget)
  };
  const r3 = {
    name:'Daniella Hathaway', role:f.r3role, initials:'DH', color:'#7b4a8c',
    blurb:'Few words. She cares about outcomes, not stories.',
    intro:"Daniella Hathaway. I'll keep this short. Three questions.",
    qs:[...pickQs(fi.map(i => ({q:i.q, tags:[i.id]})), ids(fi), 2), f.final],
    close:'Thank you. We will decide within two weeks.',
    react:{low:'(silence, then looks at the next page) Mm.', mid:'(small nod) Noted.', high:"(puts down her pen) That's a real answer."},
    passNote:'', targets:[...fi.map(toTarget), ...f.gen]
  };
  return [r1, r2, r3];
}

function buildRun(f, company, first) {
  const fs = pickN(f.skills, 5), fv = pickN(VALUES_POOL, 3), fi = pickN(f.ideas, 3);
  return {chips:buildChips(f, fs, fv, fi), jd:buildJD(f, company, fs, fv, fi), rounds:buildRounds(f, company, first, fs, fv, fi)};
}

}
function setScene(mood, night) {
  const s = $('#scene'); if (!s) return;
  const found = s.getAttribute('class').includes('found') ? ' found' : '';
  s.setAttribute('class', 'scene m-' + mood + (night ? ' night' : '') + found);
}

function wait(msg, sub, done) {
  gen++; const my = gen; let d = 0, fired = false;
  render(`<section class="paper narrow center wait">
    <p>${msg}</p>
    ${roomSvg('check')}
    <p class="day" id="day" aria-live="polite">Day 0</p>
    <div class="bar"><i id="fill"></i></div>
    <p class="muted" id="cap">${sub}</p>
    <button class="btn ghost" data-a="skip">Skip ahead</button>
  </section>`);
  clearT();
  const finish = () => { if (fired) return; fired = true; clearT(); if (my === gen) done(); };
  S.skip = finish;
  timer = setInterval(() => {
    d++; $('#day').textContent = 'Day ' + d; $('#fill').style.width = (d / CONFIG.waitDays * 100) + '%';
    const c = $('#cell' + (d - 1)); if (c) c.classList.add('x');
    const mood = d <= 5 ? 'check' : d <= 10 ? 'sad' : 'sleep';
    setScene(mood, d >= 8);
    if (d > 5) $('#cap').textContent = d <= 10 ? 'Still nothing. You refresh again.' : 'You fall asleep at your desk.';
    if (d >= CONFIG.waitDays) finish();
  }, CONFIG.dayMs);
}

const lossKind = () => Math.random() < CONFIG.ghostShare ? 'ghosted' : 'rejected';

function applyNow() {
  stats.apps++; store.save(stats);
  let ok = 0, bad = 0;
  for (const k in S.sel) for (const id of S.sel[k]) chipById(id).ok ? ok++ : bad++;
  S.resumeScore = Math.max(0, Math.round(ok / TOTAL_SLOTS * 100 - bad * 4));
  S.rival = Math.round(Math.min(98, Math.max(35, CONFIG.rivalMean + randn() * CONFIG.rivalSd)));
  const invited = S.resumeScore > S.rival;
  wait(`You sent your application to ${esc(S.company)}. Now you wait.`, 'Refreshing your inbox…', () => {
    if (invited) { stats.interviews++; store.save(stats); screenInvite(); }
    else endWith({stage:'resume', outcome: lossKind()});
  });
}

function mailTo() { return `<p><b>To:</b> ${esc(settings.name)}${settings.address ? ', ' + esc(settings.address) : ''}</p>`; }

function screenInvite() {
  render(`<section class="paper narrow center">
    <div class="stamp green">Interview invitation</div>
    <div class="mail">${mailTo()}<p><b>Subject:</b> Interview, ${esc(S.f.title)}</p><p>Hi ${esc(firstName())}, thanks for applying to ${esc(S.company)}. We would like to invite you to interview. You will meet three people, one round each.</p></div>
    <div class="btns"><button class="btn" data-a="round">Go to round 1</button></div>
  </section>`);
}

function screenRoundIntro() {
  const R = S.rounds[S.round];
  render(`<section class="paper narrow">
    <div class="who"><span class="av" style="background:${R.color}">${R.initials}</span><div><h2>Round ${S.round + 1} of 3: ${esc(R.name)}</h2><span class="muted">${esc(R.role)}</span></div></div>
    <p>${esc(R.blurb)}</p>
    <p class="muted">Answer in full sentences, at least ${CONFIG.minWords} words each. Use the language of the job. Pay attention to how the interviewer reacts.</p>
    <div class="btns"><button class="btn" data-a="begin">Begin interview</button></div>
  </section>`);
}

function screenInterview(keep) {
  const R = S.rounds[S.round];
  const log = S.chat.map(m => m.who === 'me'
    ? `<div class="msg me"><p>${esc(m.t)}</p></div>`
    : `<div class="msg them"><span class="av" style="background:${R.color}">${R.initials}</span><p>${esc(m.t)}</p></div>`).join('');
  const input = S.roundDone
    ? `<div class="btns"><button class="btn" data-a="finishRound">End interview</button></div>`
    : `<textarea id="ans" rows="4" placeholder="Type your answer in full sentences" aria-label="Your answer" ${S.busy ? 'disabled' : ''}></textarea>
       <div class="row"><span class="muted" id="wc">0 of ${CONFIG.minWords} words minimum</span><button class="btn" id="send" data-a="send" disabled>Send answer</button></div>`;
  render(`<section class="paper">
    <div class="who"><span class="av" style="background:${R.color}">${R.initials}</span><div><h2>${esc(R.name)}</h2><span class="muted">${esc(R.role)}, round ${S.round + 1} of 3</span></div></div>
    <div class="chat" id="chat" aria-live="polite">${log}</div>
    ${input}
  </section>
  ${settings.showJD ? `<details class="paper"><summary>Job description</summary>${S.jd}</details>` : ''}`, {keepScroll: !!keep});
  const c = $('#chat'); c.scrollTop = c.scrollHeight;
  const ta = $('#ans'); if (ta && !S.busy) ta.focus({preventScroll:true});
}

function sendAnswer() {
  const ta = $('#ans'); if (!ta || S.busy) return;
  const text = ta.value.trim(); if (wc(text) < CONFIG.minWords) return;
  const R = S.rounds[S.round];
  const hits = R.targets.filter(t => matches(text, t.v)).map(t => t.id).slice(0, CONFIG.maxHits);
  S.answers[S.round].push({text, hits});
  S.chat.push({who:'me', t:text}); S.busy = true;
  const my = gen; screenInterview(true);
  const lvl = hits.length >= 2 ? 'high' : hits.length === 1 ? 'mid' : 'low';
  setTimeout(() => {
    if (my !== gen) return;
    S.chat.push({who:'them', t:R.react[lvl]}); screenInterview(true);
    setTimeout(() => {
      if (my !== gen) return;
      if (S.qi < R.qs.length - 1) { S.qi++; S.chat.push({who:'them', t:R.qs[S.qi]}); }
      else { S.chat.push({who:'them', t:R.close}); S.roundDone = true; }
      S.busy = false; screenInterview(true);
    }, 900);
  }, 600);
}

function finishRound() {
  const R = S.rounds[S.round], hit = new Set();
  S.answers[S.round].forEach(a => a.hits.forEach(h => hit.add(h)));
  const need = Math.ceil(CONFIG.threshold * R.targets.length - 1e-9);
  const pass = hit.size >= need;
  S.roundRes[S.round] = {hit, need, pass};
  const r = S.round;
  if (!pass) {
    wait('The interview is over. You tell yourself it went fine.', 'Waiting to hear back…', () => endWith({stage:'r' + (r + 1), outcome: lossKind()}));
  } else if (r < 2) {
    render(`<section class="paper narrow center">
      <p>A few days later, an email arrives.</p>
      <div class="mail">${mailTo()}<p><b>From:</b> ${esc(R.name)}</p><p>${esc(R.passNote)}</p></div>
      <div class="btns"><button class="btn" data-a="nextRound">Go to round ${r + 2}</button></div>
    </section>`);
  } else {
    wait('Three interviews done. Now the company decides between you and one other strong candidate.', 'Waiting for the decision…', () => {
      if (Math.random() < CONFIG.finalOfferChance) endWith({stage:'hired', outcome:'hired'});
      else endWith({stage:'final', outcome: lossKind()});
    });
  }
}

function endWith(e) {
  S.end = e;
  if (e.outcome === 'hired') { stats.offers++; store.save(stats); }
  screenEnd();
}

function screenEnd() {
  const e = S.end, early = e.stage === 'resume', who = esc(firstName());
  let stamp, cls, body;
  if (e.outcome === 'hired') {
    stamp = 'Offer'; cls = 'green';
    body = `<div class="mail">${mailTo()}<p><b>Subject:</b> Offer, ${esc(S.f.title)}</p><p>Dear ${who}, we were impressed by how well you matched what we need at ${esc(S.company)}. We would like to offer you the role.</p></div><p><b>You got the job.</b></p>`;
  } else if (e.outcome === 'ghosted') {
    stamp = 'No response'; cls = 'grey';
    body = early ? `<p>Two weeks passed. The portal still says "Received". Nobody wrote back.</p>`
                 : `<p>You waited. You refreshed your inbox. Nothing ever came.</p>`;
  } else {
    stamp = 'Not selected'; cls = 'red';
    body = `<div class="mail">${mailTo()}<p><b>Subject:</b> Your application</p><p>Dear ${who}, ${early
      ? 'thank you for applying. We have decided to move forward with other candidates whose experience more closely matches our needs.'
      : e.stage === 'final' ? 'thank you for interviewing with us. We have offered the role to a candidate who was a closer match.'
      : 'thank you for interviewing with us. We have decided to move forward with other candidates.'}</p></div>`;
  }
  const picks = Object.keys(CHIPS).map(k => S.sel[k].map(id => {
    const c = chipById(id);
    return `<li class="${c.ok ? 'good' : 'bad'}">${esc(c.t)} <span class="${c.ok ? 'tag-good' : 'tag-bad'}">${c.ok ? 'matches the posting' : c.kind === 'off' ? 'real, but not asked for in this posting' : 'fluff'}</span></li>`;
  }).join('')).join('');
  const picked = new Set(Object.values(S.sel).flat());
  const missed = Object.values(CHIPS).flatMap(c => c.items).filter(c => c.ok && !picked.has(c.id)).map(c => esc(c.t));
  let debrief = `<h3>Debrief</h3><p class="muted">Real employers rarely tell you any of this.</p>
    <p>Your resume matched <b>${S.resumeScore}%</b> of the posting. The other applicant matched <b>${S.rival}%</b>${S.resumeScore > S.rival ? ', and you came out ahead.' : ', and they came out ahead.'}</p>
    <ul>${picks}</ul>${missed.length ? `<p>Strong options you left out: ${missed.join(', ')}.</p>` : ''}`;
  S.roundRes.forEach((rr, i) => {
    if (!rr) return;
    const R = S.rounds[i];
    const hitN = R.targets.filter(t => rr.hit.has(t.id)).map(t => esc(t.name));
    const missN = R.targets.filter(t => !rr.hit.has(t.id)).map(t => esc(t.name));
    debrief += `<p><b>Round ${i + 1}, ${esc(R.name)}:</b> you covered ${rr.hit.size} of ${R.targets.length} topics and needed ${rr.need}.${hitN.length ? `<br>Covered: ${hitN.join(', ')}.` : ''}${missN.length ? `<br>Missed: ${missN.join(', ')}.` : ''}</p>`;
  });
  if (e.stage === 'final' || e.stage === 'hired') debrief += `<p>Even after three good rounds, the final choice was close to a coin flip. That part is real.</p>`;
  render(`<section class="paper narrow center">
    <div class="stamp ${cls}">${stamp}</div>
    ${body}
    <p class="muted">Application #${stats.apps}: ${esc(S.f.title)} at ${esc(S.company)}</p>
    ${statsHtml()}
    <div class="btns"><button class="btn" data-a="again">Try again (new posting)</button><button class="btn ghost" data-a="home">Change name or job</button><button class="btn ghost" data-a="quit">Quit</button></div>
    <div class="debrief">${debrief}</div>
  </section>`);
}

/* ---------- Actions ---------- */
const actions = {
  start() {
    const n = $('#nm').value.trim();
    if (!n) { $('#nmerr').hidden = false; $('#nm').focus(); return; }
    settings.name = n; settings.address = $('#ad').value.trim();
    const r = document.querySelector('input[name=fld]:checked');
    settings.field = r ? r.value : 'art';
    settings.showJD = $('#jd').checked;
    newRun(); screenSearch();
  },
  home() { screenStart(); },
  brief() { screenBrief(); },
  quit() { screenQuit(); },
  reset() { stats = {apps:0,interviews:0,offers:0}; store.save(stats); screenQuit(); },
  resume() { screenResume(); },
  pick(d) { const c = CHIPS[d.k]; if (S.sel[d.k].length < c.slots) S.sel[d.k].push(d.id); screenResume(); },
  unpick(d) { S.sel[d.k] = S.sel[d.k].filter(x => x !== d.id); screenResume(); },
  review() { screenApply(); },
  apply() { applyNow(); },
  skip() { if (S.skip) S.skip(); },
  round() { S.round = 0; screenRoundIntro(); },
  nextRound() { S.round++; screenRoundIntro(); },
  begin() { const R = S.rounds[S.round]; S.qi = 0; S.busy = false; S.roundDone = false; S.chat = [{who:'them', t:R.intro}, {who:'them', t:R.qs[0]}]; screenInterview(false); },
  send() { sendAnswer(); },
  finishRound() { finishRound(); },
  again() { newRun(); screenSearch(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const fn = actions[b.dataset.a];
  if (fn) fn(b.dataset);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'ans') return;
  const n = wc(e.target.value);
  $('#wc').textContent = `${n} of ${CONFIG.minWords} words minimum`;
  $('#send').disabled = n < CONFIG.minWords;
});

screenStart();
</script>
